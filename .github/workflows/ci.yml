name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gratis en repos públicos, sin licencia. Escanea el historial
      # nuevo de cada push/PR en busca de claves, tokens o
      # credenciales — una red de seguridad barata para un repo
      # público, no un sustituto de no commitear secretos nunca.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Tests + cobertura
        run: python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=80

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.11.4"

      - name: Format check
        run: terraform fmt -check -recursive

      # -backend=false: valida sintaxis y tipos sin necesitar
      # credenciales AWS ni acceso al estado remoto.
      - name: Init (sin backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate
